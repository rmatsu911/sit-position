# 開発用: frontend / backend / postgres / minio をまとめて起動。
# AI Worker は将来 services に追加可能（施工管理APIとは分離可能な構成）。
#
#   docker compose up -d
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python -m app.seed.seed
#
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sysken
      POSTGRES_PASSWORD: sysken
      POSTGRES_DB: sysken
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysken"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://sysken:sysken@postgres:5432/sysken
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:5173
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: sysken
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    command: npm run dev -- --host

  # ai-worker:   # 将来追加（ai_analysis_jobs を処理し ai_predictions を書き込む）
  #   build: ./ai-worker
  #   depends_on: [postgres, minio]

volumes:
  pgdata:
  miniodata:
