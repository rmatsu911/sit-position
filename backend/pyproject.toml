[project]
name = "sysken-backend"
version = "0.1.0"
description = "株式会社SYSKEN AI施工管理システム — Backend API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "boto3>=1.34",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["ultralytics>=8.2"]  # YOLO 実推論（GPU/学習環境に導入。本体は未導入でも動作）
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ai_worker*"]
exclude = ["tests*", "alembic*", "datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
