# Render Blueprint — 株式会社SYSKEN AI施工管理システム
# React(静的) + FastAPI(Docker) + PostgreSQL(マネージド) を一括デプロイする。
# 使い方: https://dashboard.render.com/ → New → Blueprint → このリポジトリを選択。
# デプロイ後に、下の sync:false の2値（VITE_API_BASE_URL / CORS_ORIGINS / PUBLIC_BASE_URL）を
# 実際に払い出された URL に合わせて設定し、再デプロイする（詳細は docs/deploy-render.md）。

databases:
  - name: sysken-db
    databaseName: sysken
    user: sysken
    plan: free

services:
  # ---- Backend (FastAPI, Docker) ----
  - type: web
    name: sysken-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # 起動時に マイグレーション → 初期投入(冪等) → uvicorn。
    #
    # `--bootstrap` は **初期管理者と区分マスタだけ** を作る。案件・工程・写真・日報
    # などの業務データは作らない（架空の案件を公開環境に出さないため）。
    # 何度起動しても同じ結果になる。
    #
    # `--force-production` は開発用フィクスチャ（架空の案件8件と、全員が同じ既知
    # パスワードの利用者10名）を投入する。公開環境では使わない。
    dockerCommand: sh -c "alembic upgrade head && python -m app.seed.seed --bootstrap && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sysken-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # 長いランダム値を自動生成
      - key: SEED_ADMIN_EMAIL
        value: admin@example.co.jp
      - key: SEED_ADMIN_PASSWORD
        sync: false                  # 初回デプロイ前に安全な値を設定（チャットに貼らない）
      - key: STORAGE_BACKEND
        value: local
      - key: PUBLIC_BASE_URL
        sync: false                  # 例: https://sysken-backend.onrender.com
      - key: CORS_ORIGINS
        sync: false                  # 例: https://sysken-frontend.onrender.com
      # サブパス配信をしないため空。/sysken/api のような構成のときだけ設定する。
      - key: API_ROOT_PATH
        value: ""
      # 稼働中のコードSHAは Render が渡す RENDER_GIT_COMMIT をそのまま読む
      # （app/api/system.py の _commit()）。ここで設定する必要はない。
      # 他ホストへ置くときは GIT_COMMIT を明示的に渡す（docs/deploy-render.md）。

  # ---- Frontend (静的サイト) ----
  - type: web
    name: sysken-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA: すべてのパスを index.html へ（直リンク404を防ぐ）
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_ENV
        value: production
      - key: VITE_API_BASE_URL
        sync: false                  # 例: https://sysken-backend.onrender.com/api
      # ビルド時のコミットSHAは Render が渡す RENDER_GIT_COMMIT を vite.config.ts が
      # そのまま読む。手元でビルドして他ホストへ置くときは GIT_COMMIT を渡すこと
      # （渡さないと画面のSHAが unknown になり、稼働中のコードを確認できない）。
